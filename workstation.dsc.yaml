# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# Core config: Windows settings, dev tools, homelab access, everyday apps.
# One-time setup:  winget configure --enable
# Run from an elevated terminal:
#   winget configure -f workstation.dsc.yaml --accept-configuration-agreements
properties:
  configurationVersion: 0.2.0
  resources:

    # ---------- Windows settings ----------
    - resource: Microsoft.Windows.Developer/DeveloperMode
      id: devMode
      directives:
        description: Enable Developer Mode
        allowPrerelease: true
        securityContext: elevated
      settings:
        Ensure: Present

    - resource: Microsoft.Windows.Developer/WindowsExplorer
      id: explorer
      directives:
        description: Show file extensions and hidden files
        allowPrerelease: true
      settings:
        FileExtensions: Show
        HiddenFiles: Show
        ItemCheckBoxes: Hide

    - resource: Microsoft.Windows.Developer/EnableDarkMode
      id: darkMode
      directives:
        description: Dark mode for apps and system
        allowPrerelease: true
      settings:
        Ensure: Present
        RestartExplorer: true

    # ---------- Dev: version control, editors, AI tools ----------

