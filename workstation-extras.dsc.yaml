# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# Extras: hardware tools, peripherals, game launchers, flight sim tooling.
# Skip this file on machines without the matching hardware.
# One-time setup:  winget configure --enable
# Run from an elevated terminal:
#   winget configure -f workstation-extras.dsc.yaml --accept-configuration-agreements
